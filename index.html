<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F5F0E7"><title>Todo-Teens</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#today"><span aria-hidden="true">✧</span> Todo-Teens</a><p class="eyebrow">DIN DAG, PÅ DITT SÄTT</p><nav aria-label="Huvudmeny"><a href="#today" data-page="today"><i data-icon="house"></i>Idag</a><a href="#calendar" data-page="calendar"><i data-icon="calendar-days"></i>Kalender</a><a href="#notes" data-page="notes"><i data-icon="notebook-pen"></i>Anteckningar</a></nav><div class="profile-card"><a href="#progress"><i data-icon="circle-user-round"></i><span class="user-name">Min profil</span></a><a href="#settings" class="subtle">Framsteg & inställningar</a></div></aside>
<main>
<header class="topbar"><a class="brand mobile-brand" href="#today">✧ Todo-Teens</a><span id="today-date"></span><div class="header-actions"><a href="#settings" class="icon-button" aria-label="Inställningar"><i data-icon="settings-2"></i></a><a href="#progress" class="profile-link"><i data-icon="circle-user-round"></i><span class="user-name">Min profil</span></a></div></header>
<nav class="mobile-nav" aria-label="Mobilmeny"><a href="#today" data-page="today"><i data-icon="house"></i>Idag</a><a href="#calendar" data-page="calendar"><i data-icon="calendar-days"></i>Kalender</a><a href="#notes" data-page="notes"><i data-icon="notebook-pen"></i>Anteckningar</a></nav>
<div id="page"></div>
<footer>Sparas på den här enheten. Delar ni webbläsare? Då syns samma uppgifter.</footer>
</main>
<dialog id="task-dialog" aria-labelledby="dialog-title"><form id="task-form"><div class="dialog-heading"><h2 id="dialog-title">Ny uppgift</h2><button type="button" class="icon-button" data-close aria-label="Stäng"><i data-icon="x"></i></button></div><p class="muted">En sak mindre att hålla i huvudet.</p><input type="hidden" name="id"><label>Vad vill du få gjort?<input name="title" required maxlength="160" placeholder="Till exempel: Läs kapitel 4"></label><label>Kategori<select name="category"><option>Skola</option><option>Personligt</option><option>Fritid</option></select></label><div class="form-row"><label>Datum<input name="date" type="date"></label><label>Tid · valfritt<input name="time" type="time"></label></div><label>Delsteg · en per rad<textarea name="checklist" rows="3" placeholder="Läs sidorna 42–45&#10;Skriv tre viktiga punkter"></textarea></label><label>Anteckning · valfritt<textarea name="description" rows="2" maxlength="2000"></textarea></label><button class="button primary" type="submit"><i data-icon="check"></i>Spara uppgift</button><button type="button" class="button quiet" data-close>Avbryt</button></form></dialog>
<dialog id="note-dialog" aria-labelledby="note-dialog-title"><form id="note-form"><div class="dialog-heading"><h2 id="note-dialog-title">Ny anteckning</h2><button type="button" class="icon-button" data-close aria-label="Stäng"><i data-icon="x"></i></button></div><input type="hidden" name="id"><label>Rubrik<input name="title" required maxlength="160"></label><label>Din anteckning<textarea name="body" rows="8" maxlength="10000"></textarea></label><button class="button primary" type="submit">Spara anteckning</button><button type="button" class="button quiet" data-close>Avbryt</button></form></dialog>
<p class="toast" role="status" id="toast"></p>
</body></html>
